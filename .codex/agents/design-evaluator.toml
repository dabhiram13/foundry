| Pattern Compliance | {PASS/FAIL/WARN/UNKNOWN} | {details} |
| Visual Quality | {PASS/FAIL/WARN/UNKNOWN} | {details} |
| Accessibility | {PASS/FAIL/WARN/UNKNOWN} | {details} |
| Baseline Gotchas | {PASS/FAIL/WARN/UNKNOWN} | {planner-omission: ... or none} |

## Core Web Vitals
- {page}: TTFB {X}ms, LCP {X}ms, CLS {X}, Hydration {X}ms

## Verdict: {PASS / FAIL — needs connector/designer re-run / UNKNOWN — checks could not run}

Deliverables checked: {N total}, {N unmet}
