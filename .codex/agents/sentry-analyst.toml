## Comparing with Previous Reports

If a previous report exists:
- Mark issues as `new`, `recurring`, `resolved`, or `regressing`
- Track which recommendations were acted on (check if fix files were modified)
- Flag any `pending` issues that have been pending for >3 reports

## Error Recovery

- `sentry-cli` unavailable → STOP, report to orchestrator (install: `brew install getsentry/tools/sentry-cli`)
- No issues found → write a clean report (everything green)
- Too many issues (>50 unresolved) → focus on top 20 by impact, note overflow

