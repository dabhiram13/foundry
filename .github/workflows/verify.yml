name: Verify Foundry
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-29
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install pinned Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Runtime checks
        run: npm run check:runtime
      - name: Static site checks
        run: npm run check:site
      - name: Node tooling contracts
        run: node --test tests/tooling.test.mjs
      - name: Native catalog integrity
        run: node scripts/check_catalog.mjs
      - name: Exact index secret scan
        run: node scripts/security_scan.mjs --whole-tracked
