name: Verify Foundry
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24.19.0', '25.2.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-29
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Runtime checks
        run: npm run check:runtime
      - name: Static site checks
        run: npm run check:site
      - name: Node tooling contracts
        run: node --test tests/tooling.test.mjs
      - name: Native catalog integrity
        run: node scripts/check_catalog.mjs
      - name: Exact index secret scan
        run: node scripts/security_scan.mjs --whole-tracked
  managed-executor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24.19.0', '25.2.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install selected OpenCode 1.19.0
        run: npm install --prefix "$RUNNER_TEMP/managed-executor" --ignore-scripts --no-audit --no-fund opencode-linux-x64@1.19.0
      - name: Required managed executor qualification
        env:
          FOUNDRY_OPENCODE_QUALIFY_BINARY: ${{ runner.temp }}/managed-executor/node_modules/opencode-linux-x64/bin/opencode
        run: npm run test:managed-executor
